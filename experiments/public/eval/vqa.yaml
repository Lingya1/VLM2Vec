# MMEB I-QA 评测：10 个视觉问答子集，与官方 image.yaml 的 QA 段完全一致。
#   in-domain（训练过）: OK-VQA, A-OKVQA, DocVQA, InfographicsVQA, ChartQA, Visual7W
#   zero-shot（未训练）: ScienceQA, VizWiz, GQA, TextVQA
# 每个子集 1000 条 query。标注取自 ziyjiang/MMEB_Test_Instruct（已缓存），
# 图像取自本地 MMEB-V2/image-tasks/。
#
# 与 CLS 的一个关键差别：全部 10 个子集共用同一条指令
# "Represent the given image with the following question:"，区分度来自其后拼接的具体问题。
# 因此不存在 CLS 那种"某个子集独占一条指令并把它的标签空间专用化"的风险。
OK-VQA:
    dataset_parser: image_qa
    dataset_name: OK-VQA
    dataset_split: test
    image_root: image-tasks/
    eval_type: local
